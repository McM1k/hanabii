[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
game-core = { path = "../game-core" }
leptos = { version = "0.6", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.7"
web-sys = { version = "0.3", features = ["DragEvent", "DataTransfer", "Element", "HtmlElement", "HtmlDivElement", "DomRect"] }
futures = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
